name: tictactoe_arena
description: TicTacToe Arena, a cross-platform Tic-Tac-Toe game by Team Alpha.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  game_ai:
    path: packages/game_ai
  game_engine:
    path: packages/game_engine

dev_dependencies:
  firebase_auth_mocks: ^0.16.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mock_exceptions: ^0.8.2

flutter:
  uses-material-design: true
