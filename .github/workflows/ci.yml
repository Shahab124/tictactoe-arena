name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test game engine
        working-directory: packages/game_engine
        run: |
          flutter pub get
          dart test
      - name: Test Game AI
        working-directory: packages/game_ai
        run: |
          flutter pub get
          dart test
      - name: Install app dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test app
        run: flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test database rules
        run: |
          npm ci --prefix firestore
          npx --yes firebase-tools@15 emulators:exec --project demo-tictactoe-arena --only firestore "npm test --prefix firestore"
      - name: Build web version
        run: |
          flutter create --platforms=web --project-name tictactoe_arena .
          flutter build web
