name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # ponytail: pinned to match the team's laptops; Flutter 3.50 deprecates
          # package:flutter/material.dart, so bump this together with that migration.
          flutter-version: 3.47.9
          cache: true
      - name: Test game engine
        working-directory: packages/game_engine
        run: |
          flutter pub get
          dart test
      - name: Test Game AI
        working-directory: packages/game_ai
        run: |
          flutter pub get
          dart test
      - name: Install app dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test app
        run: flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test database rules
        run: |
          npm ci --prefix firestore
          npx --yes firebase-tools@15 emulators:exec --project demo-tictactoe-arena --only firestore "npm test --prefix firestore"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # ponytail: pinned to match the team's laptops; Flutter 3.50 deprecates
          # package:flutter/material.dart, so bump this together with that migration.
          flutter-version: 3.47.9
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create platform folders
        run: flutter create --platforms=android,web --org com.teamalpha --project-name tictactoe_arena .
      # ponytail: APK is signed with the runner's throwaway debug key, so each
      # build has a new signature; add a keystore secret if updates must install
      # over an older APK or Google sign-in needs a fixed SHA-1.
      - name: Build release APK
        run: flutter build apk --release
      - name: Build web version
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: tictactoe-arena-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tictactoe-arena-web
          path: build/web
